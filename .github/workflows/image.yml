name: Build Image

on:
  push:

permissions:
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build Image
        run: docker build -t mon-app .
      - name: login to ghcr
        if: github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      - name: tag image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag mon-app ghcr.io/n-haitu31/holbertonschool-continuous_integrations:${{ github.sha }}
          docker tag mon-app ghcr.io/n-haitu31/holbertonschool-continuous_integrations:latest
      - name: push image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/n-haitu31/holbertonschool-continuous_integrations:${{ github.sha }}
          docker push ghcr.io/n-haitu31/holbertonschool-continuous_integrations:latest